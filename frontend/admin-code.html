<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/auth.js"></script>
<title>Fastshot — Admin Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--line:rgba(214,228,255,.10);--soft:rgba(255,255,255,.06);--text:#ECECEF;--muted:#98999C;--dim:#77787B;--accent:#F49D70;--err:#FBBC94;--ok:#8FD3A8}
body{min-height:100vh;background:#0a0d12;color:var(--text);font:14px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #F8B285;outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding:18px 20px 64px}
.tabs{display:flex;gap:14px;padding:6px 2px 10px;font-size:14px}
.tabs a{color:var(--dim);padding:2px 2px}
.tabs a[aria-current=page]{color:var(--text)}
.btn{padding:7px 14px;border-radius:9px;background:var(--text);color:#0a0d12;font-weight:500}
form{display:grid;gap:14px}
label{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
label b{font-weight:500;color:var(--text);font-size:13px}
input{padding:8px 10px;border-radius:9px;background:#1f232b;border:1px solid var(--line);color:var(--text);width:100%}
input[type=checkbox]{width:auto}
.hint{font-size:12px;color:var(--dim)}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:6px}#toast div{padding:8px 12px;border-radius:9px;background:#1f232b}.ok{color:var(--ok)}.err{color:var(--err)}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <nav class="tabs" aria-label="Admin"><a href="/admin.html">Users</a><a href="/admin-models.html">Models</a><a href="/admin-tools.html">Tools</a><a href="/admin-code.html" aria-current="page">Code</a><a href="/admin-features.html">Features</a></nav>
  <p class="hint" style="margin:0 2px 12px">Run button under Python code in chat replies. The code runs in the user's own browser (Pyodide), in a sandbox: it cannot use their login, reach other addresses or touch server files. Applies to the next page load, no restart.</p>
  <form id="f" style="max-width:420px">
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="enabled"><b>Enable code execution</b></label>
    <label><b>Time limit (seconds)</b><input name="timeout" type="number" min="1" max="600"><span class="hint">A run that takes longer is stopped. 1 to 600.</span></label>
    <div><button class="btn" type="submit">Save</button></div>
  </form>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = (id) => document.getElementById(id);
const toast = (t, ok) => { const d = document.createElement('div'); d.className = ok ? 'ok' : 'err'; d.textContent = t; $('toast').append(d); setTimeout(() => d.remove(), 4000); };
const api = async (method, body) => {
  const r = await fetch('/api/code', { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : 'Request failed');
  return j;
};
const show = (c) => { $('f').enabled.checked = c.enabled; $('f').timeout.value = c.timeout; };
$('f').onsubmit = async (e) => {
  e.preventDefault();
  try { show(await api('PUT', { enabled: $('f').enabled.checked, timeout: $('f').timeout.value })); toast('Saved', true); }
  catch (x) { toast(x.message); }
};
(async () => {
  const me = await authReady;
  if (me.role !== 'admin') return location.replace('/');
  show(await api('GET'));
  $('app').hidden = false;
})().catch((x) => toast(x.message));
</script>
</body>
</html>
