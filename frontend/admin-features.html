<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/auth.js"></script>
<title>Fastshot — Admin Features</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--line:rgba(214,228,255,.10);--soft:rgba(255,255,255,.06);--text:#ECECEF;--muted:#98999C;--dim:#77787B;--accent:#F49D70;--err:#FBBC94;--ok:#8FD3A8}
body{min-height:100vh;background:#0a0d12;color:var(--text);font:14px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #F8B285;outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding:18px 20px 64px}
.tabs{display:flex;gap:14px;padding:6px 2px 10px;font-size:14px}
.tabs a{color:var(--dim);padding:2px 2px}
.tabs a[aria-current=page]{color:var(--text)}
.hint{font-size:12px;color:var(--dim)}
.model{font-size:12.5px;margin:0 2px 12px;color:var(--ok)}
.model.bad{color:var(--err)}
#rows{list-style:none;max-width:640px}
#rows li{display:flex;align-items:flex-start;gap:14px;padding:12px 10px;border-top:1px solid var(--soft)}
#rows li:first-child{border-top:0}
#rows li.sub{padding-left:32px}
#rows li.off-parent{opacity:.5}
#rows div{flex:1;min-width:0}
#rows b{display:block;font-weight:500;font-size:13.5px}
#rows p{font-size:12.5px;color:var(--muted)}
/* switch: Open WebUI's 28x16 pill, as on the Tools tab */
.sw{position:relative;width:28px;height:16px;border-radius:999px;background:#3a3d44;flex:none;margin-top:3px;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#8b8d93;transition:left .15s,background .15s}
.sw[aria-checked=true]{background:var(--text)}
.sw[aria-checked=true]::after{left:14px;background:#0a0d12}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:6px}#toast div{padding:8px 12px;border-radius:9px;background:#1f232b}.ok{color:var(--ok)}.err{color:var(--err)}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <nav class="tabs" aria-label="Admin"><a href="/admin.html">Users</a><a href="/admin-models.html">Models</a><a href="/admin-tools.html">Tools</a><a href="/admin-code.html">Code</a><a href="/admin-features.html" aria-current="page">Features</a></nav>
  <p class="hint" style="margin:0 2px 8px">Built-in skills, for everyone. A skill is offered to the model only when a message needs it: a picked database, a request for a chart, or something to remember. Applies to the next message, no restart.</p>
  <p class="model" id="model"></p>
  <ul id="rows"></ul>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = (id) => document.getElementById(id);
const toast = (t, ok) => { const d = document.createElement('div'); d.className = ok ? 'ok' : 'err'; d.textContent = t; $('toast').append(d); setTimeout(() => d.remove(), 4000); };
const api = async (method, body) => {
  const r = await fetch('/api/admin/features', { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : 'Request failed');
  return j;
};
let skills = [], on = {};
function draw() {
  $('rows').replaceChildren(...skills.map((s) => {
    const li = document.createElement('li'), text = document.createElement('div'), b = document.createElement('b'), p = document.createElement('p'), sw = document.createElement('button');
    li.className = (s.parent ? 'sub' : '') + (s.parent && !on[s.parent] ? ' off-parent' : '');
    b.textContent = s.name; b.id = 'n-' + s.id; p.textContent = s.about; text.append(b, p);
    sw.type = 'button'; sw.className = 'sw'; sw.setAttribute('role', 'switch'); sw.setAttribute('aria-labelledby', b.id);
    sw.setAttribute('aria-checked', String(!!on[s.id]));
    sw.onclick = async () => {
      try { on = (await api('POST', { [s.id]: !on[s.id] })).on; draw(); toast(s.name + (on[s.id] ? ' is on' : ' is off'), true); }
      catch (x) { toast(x.message); }
    };
    li.append(text, sw);
    return li;
  }));
}
(async () => {
  const me = await authReady;
  if (me.role !== 'admin') return location.replace('/');
  const d = await api('GET');
  skills = d.skills; on = d.on;
  $('model').textContent = d.model.ready
    ? 'Skills run on ' + d.model.label + ', which can call tools.'
    : 'Skills need a local model that can call tools. ' + (d.model.label ? d.model.label + ': ' : '') + (d.model.note || '');
  $('model').classList.toggle('bad', !d.model.ready);
  draw();
  $('app').hidden = false;
})().catch((x) => toast(x.message));
</script>
</body>
</html>
