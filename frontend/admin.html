<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/auth.js"></script>
<title>Fastshot — Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--line:rgba(214,228,255,.10);--soft:rgba(255,255,255,.06);--text:#ECECEF;--muted:#98999C;--dim:#77787B;--accent:#F49D70;--err:#FBBC94;--ok:#8FD3A8}
body{min-height:100vh;background:#0a0d12;color:var(--text);font:14px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #F8B285;outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding:18px 20px 64px}
/* top tabs, as in Open WebUI's admin layout */
.tabs{display:flex;gap:14px;padding:6px 2px 10px;font-size:14px}
.tabs a{color:var(--dim);padding:2px 2px}
.tabs a[aria-current=page]{color:var(--text)}
.head{display:flex;align-items:center;gap:8px;margin:10px 2px 14px;font-size:18px}
.count{font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 9px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--soft)}
.search svg{width:14px;height:14px;color:var(--dim);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0}
.btn{padding:6px 12px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:13px}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.go{background:linear-gradient(163deg,#FBBC94,#F49D70 46%,#E88654);color:#1d1d20;font-weight:500;border:0}
.btn.bad{color:var(--err)}
.btn:disabled{opacity:.55;cursor:default}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:400;font-size:12px;color:var(--muted);text-align:left;border-bottom:1.5px solid var(--line);white-space:nowrap}
th button{display:flex;align-items:center;gap:5px;padding:7px 10px;color:inherit;width:100%;text-align:left}
th button:hover{color:var(--text)}
th[aria-sort=ascending] button::after{content:"↑"}
th[aria-sort=descending] button::after{content:"↓"}
td{padding:9px 10px;border-bottom:1px solid var(--soft);white-space:nowrap;color:#D5D5D8}
tr:hover td{background:rgba(255,255,255,.025)}
.name{display:flex;align-items:center;gap:9px}
.dot{width:8px;height:8px;border-radius:50%;background:#4a4c52;flex:none}
.dot.on{background:#3fcf6d}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:500}
.badge.admin{background:rgba(156,134,206,.2);color:#C9B8F0}
.badge.user{background:rgba(63,207,109,.14);color:#8FD3A8}
.off{opacity:.5}
td.act{text-align:right}
td.act button{width:30px;height:30px;border-radius:8px;color:var(--muted)}
td.act button:hover{background:rgba(255,255,255,.09);color:var(--text)}
td.act svg{width:15px;height:15px}
.none{padding:26px 10px;color:var(--dim)}
#toast{position:fixed;right:18px;bottom:18px;z-index:90;display:grid;gap:8px}
#toast div{padding:9px 14px;border-radius:10px;background:#1b1e25;border:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.4)}
#toast .err{color:var(--err)}#toast .ok{color:var(--ok)}
dialog{margin:auto;width:min(440px,calc(100vw - 32px));border:1px solid var(--line);border-radius:16px;background:#14171d;color:var(--text);padding:0}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{padding:20px;display:grid;gap:12px}
dialog h2{font-size:16px;font-weight:500}
dialog .sub{display:flex;gap:6px}
dialog .sub button{padding:4px 10px;border-radius:8px;color:var(--muted)}
dialog .sub button[aria-selected=true]{background:var(--soft);color:var(--text)}
dialog label{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
dialog label input,dialog label select{height:36px;padding:0 10px;border-radius:9px;background:#1f232b;border:1px solid var(--line);color:var(--text)}
dialog label.check{display:flex;align-items:center;gap:8px}
dialog label.check input{height:auto}
.err-line{color:var(--err);min-height:1.3em;font-size:13px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hint{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <nav class="tabs" aria-label="Admin"><a href="/admin.html" aria-current="page">Users</a><a href="/admin-models.html">Models</a><a href="/admin-tools.html">Tools</a><a href="/admin-code.html">Code</a><a href="/admin-features.html">Features</a></nav>
  <div class="head"><h1 style="font-size:inherit;font-weight:500">Users</h1><span class="count" id="count">0</span></div>
  <div class="bar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search" aria-label="Search users">
    </label>
    <button class="btn" id="add">Add User</button>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr id="heads"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="none" id="none" hidden>No users match.</div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="addDlg">
  <form id="addForm" method="dialog">
    <h2>Add User</h2>
    <div class="sub" role="tablist"><button type="button" role="tab" id="tabForm" aria-selected="true">Form</button><button type="button" role="tab" id="tabCsv" aria-selected="false">CSV Import</button></div>
    <div id="paneForm" style="display:grid;gap:12px">
      <label>Role<select name="role"><option value="user">User</option><option value="admin">Admin</option></select></label>
      <label>Name<input name="name" required autocomplete="off"></label>
      <label>Email<input name="email" type="email" required autocomplete="off"></label>
      <label>Password (at least 8 characters)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
    </div>
    <div id="paneCsv" hidden style="display:grid;gap:10px">
      <label>CSV file<input id="csv" type="file" accept=".csv,text/csv"></label>
      <p class="hint">First row is a header. Columns: Name, Email, Password, Role (admin or user).</p>
    </div>
    <div class="err-line" id="addErr" role="alert"></div>
    <div class="row"><button type="button" class="btn" data-close>Cancel</button><button class="btn go" id="addGo">Save</button></div>
  </form>
</dialog>

<dialog id="editDlg">
  <form id="editForm" method="dialog">
    <h2>Edit User</h2>
    <label>Name<input name="name" required></label>
    <label>Email<input name="email" type="email" required></label>
    <label>Role<select name="role"><option value="user">User</option><option value="admin">Admin</option></select></label>
    <label>New password (leave empty to keep)<input name="password" type="password" minlength="8" autocomplete="new-password"></label>
    <label class="check"><input name="active" type="checkbox"> Account is active</label>
    <p class="hint">Changing the password, the role, or disabling the account signs the user out everywhere.</p>
    <div class="err-line" id="editErr" role="alert"></div>
    <div class="row"><button type="button" class="btn" id="revoke">Sign out everywhere</button><button type="button" class="btn" data-close>Cancel</button><button class="btn go">Save</button></div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let users = [], sortKey = 'created_at', dir = -1, editing = null;

function toast(text, ok) {
  const d = document.createElement('div'); d.className = ok ? 'ok' : 'err'; d.textContent = text; $('toast').append(d);
  setTimeout(() => d.remove(), 4000);
}
// JSON in and out; a 401 goes to the login page, anything else throws the API's `detail` text.
async function api(path, method = 'GET', body) {
  const r = await fetch('/api/auth' + path, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  if (r.status === 401) { location.replace('/login.html'); throw new Error('Signed out.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : 'Error ' + r.status);
  return j;
}
const when = (t) => (t ? new Date(t * 1000).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '');
const ICON = {
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>'
};

const COLS = [['role', 'Role'], ['name', 'Name'], ['email', 'Email'], ['last_active_at', 'Last Active'], ['created_at', 'Created At']];
function drawHead() {
  const tr = $('heads'); tr.replaceChildren();
  for (const [key, label] of COLS) {
    const th = document.createElement('th'); th.scope = 'col';
    th.setAttribute('aria-sort', key === sortKey ? (dir > 0 ? 'ascending' : 'descending') : 'none');
    const b = document.createElement('button'); b.textContent = label;
    b.onclick = () => { dir = key === sortKey ? -dir : 1; sortKey = key; draw(); };
    th.append(b); tr.append(th);
  }
  tr.append(document.createElement('th'));
}
function draw() {
  drawHead();
  const q = $('q').value.trim().toLowerCase();
  const list = users.filter((u) => !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
  list.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * dir;
  });
  $('count').textContent = users.length;
  $('none').hidden = list.length > 0;
  const rows = $('rows'); rows.replaceChildren();
  for (const u of list) {
    const tr = rows.insertRow(); if (!u.active) tr.className = 'off';
    const role = tr.insertCell(); const badge = document.createElement('span'); badge.className = 'badge ' + u.role; badge.textContent = u.role; role.append(badge);
    const name = document.createElement('div'); name.className = 'name'; tr.insertCell().append(name);
    const dot = document.createElement('span'); dot.className = 'dot' + (Date.now() / 1000 - u.last_active_at < 180 ? ' on' : ''); dot.title = dot.className.includes('on') ? 'Active now' : 'Not active now';
    const label = document.createElement('span'); label.textContent = u.name + (u.active ? '' : ' (disabled)'); name.append(dot, label);
    tr.insertCell().textContent = u.email;
    tr.insertCell().textContent = when(u.last_active_at);
    tr.insertCell().textContent = when(u.created_at);
    const act = tr.insertCell(); act.className = 'act';
    const mk = (icon, label, fn) => { const b = document.createElement('button'); b.innerHTML = icon; b.setAttribute('aria-label', label + ' ' + u.email); b.title = label; b.onclick = fn; act.append(b); };
    mk(ICON.edit, 'Edit', () => openEdit(u));
    mk(ICON.del, 'Delete', async () => {
      if (!confirm('Delete ' + u.email + ' and their chats?')) return;
      try { await api('/users/' + u.id + '/delete', 'POST'); toast('User deleted.', true); load(); } catch (e) { toast(e.message); }
    });
  }
}
async function load() { try { users = await api('/users'); draw(); } catch (e) { toast(e.message); } }

// ── add ──
const addDlg = $('addDlg');
function addTab(csv) {
  $('tabForm').setAttribute('aria-selected', String(!csv)); $('tabCsv').setAttribute('aria-selected', String(csv));
  $('paneForm').hidden = csv; $('paneCsv').hidden = !csv;
  for (const i of $('paneForm').querySelectorAll('input')) i.required = !csv;
  $('addErr').textContent = '';
}
$('add').onclick = () => { $('addForm').reset(); addTab(false); addDlg.showModal(); };
$('tabForm').onclick = () => addTab(false);
$('tabCsv').onclick = () => addTab(true);
$('addForm').onsubmit = async (e) => {
  e.preventDefault(); $('addErr').textContent = '';
  $('addGo').disabled = true;
  try {
    if (!$('paneCsv').hidden) await importCsv(); else {
      await api('/users', 'POST', Object.fromEntries(new FormData($('addForm'))));
      toast('User added.', true);
    }
    addDlg.close(); load();
  } catch (err) { $('addErr').textContent = err.message; }
  $('addGo').disabled = false;
};
// The same rules as Open WebUI's import: a header row, then exactly Name, Email, Password, Role.
async function importCsv() {
  const file = $('csv').files[0]; if (!file) throw new Error('Choose a CSV file first.');
  const rows = (await file.text()).split('\n').slice(1).map((r) => r.split(',').map((c) => c.trim())).filter((c) => !(c.length === 1 && c[0] === ''));
  let ok = 0; const bad = [];
  for (const [i, c] of rows.entries()) {
    if (c.length !== 4 || !['admin', 'user'].includes(c[3].toLowerCase())) { bad.push('Row ' + (i + 2) + ': invalid format'); continue; }
    try { await api('/users', 'POST', { name: c[0], email: c[1], password: c[2], role: c[3].toLowerCase() }); ok++; }
    catch (e) { bad.push('Row ' + (i + 2) + ': ' + e.message); }
  }
  toast('Successfully imported ' + ok + ' users.', true);
  for (const b of bad) toast(b);
}

// ── edit ──
const editDlg = $('editDlg'), editForm = $('editForm');
function openEdit(u) {
  editing = u; $('editErr').textContent = '';
  editForm.name.value = u.name; editForm.email.value = u.email; editForm.role.value = u.role; editForm.password.value = ''; editForm.active.checked = u.active;
  editDlg.showModal();
}
editForm.onsubmit = async (e) => {
  e.preventDefault();
  const body = { name: editForm.name.value, email: editForm.email.value, role: editForm.role.value, active: editForm.active.checked };
  if (editForm.password.value) body.password = editForm.password.value;
  try { await api('/users/' + editing.id, 'POST', body); editDlg.close(); toast('Saved.', true); load(); }
  catch (err) { $('editErr').textContent = err.message; }
};
$('revoke').onclick = async () => {
  try { await api('/users/' + editing.id + '/revoke', 'POST'); toast('Signed out everywhere.', true); editDlg.close(); }
  catch (err) { $('editErr').textContent = err.message; }
};
for (const b of document.querySelectorAll('[data-close]')) b.onclick = () => b.closest('dialog').close();

$('q').oninput = draw;
// Only admins get this page: anyone else goes back to the chat (the API refuses them anyway).
authReady.then((me) => {
  if (!me) return;
  if (me.role !== 'admin') { location.replace('/'); return; }
  $('app').hidden = false; load();
});
</script>
<style>.pwbox{position:relative;display:block}.pwbox input{width:100%;box-sizing:border-box;padding-right:40px}.pweye{position:absolute;right:6px;bottom:6px;background:none;border:0;cursor:pointer;font-size:16px;opacity:.7;padding:4px 6px}.pweye:hover{opacity:1}</style>
<script>
// An eye button on every password box: press to show it, press again to hide it.
function addEyes(root){(root||document).querySelectorAll('input[type=password]:not([data-eye])').forEach(function(i){
  i.dataset.eye=1;var w=document.createElement('span');w.className='pwbox';i.parentNode.insertBefore(w,i);w.appendChild(i);
  var b=document.createElement('button');b.type='button';b.className='pweye';b.title='Show password';b.textContent='\u{1F441}';
  b.onclick=function(){var s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'\u{1F648}':'\u{1F441}';b.title=s?'Hide password':'Show password'};
  w.appendChild(b)})}
addEyes();
</script>
</body>
</html>
