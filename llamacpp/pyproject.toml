[project]
name = "llamacpp-pipeline"
version = "0.1.0"
description = "The chat pipeline on llama-server (llama.cpp) instead of Ollama."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ollama-pipeline",
]

[tool.uv.sources]
ollama-pipeline = { path = "../ollama", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llamacpp_pipeline"]
