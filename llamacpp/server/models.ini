; The models llama-server serves for this app (router mode: --models-preset).
; Each [section] name is the model name the app asks for; llamacpp/config/models.yaml
; refers to them under `model:`.
;
; The files are Ollama's own, read in place (mounted read-only at /models by start.sh).
; `ollama show <model> --modelfile` prints their paths; a second FROM line is the vision part.
;
; Memory: llama-server is the only thing on the 16 GB card (Ollama is not used by
; the app in this mode). Both models stay loaded: llama3.1:8b about 6 GB at
; ctx-size 16384, gemma4:12b with its vision part 8.7 GB at 16384. Do not load
; models in Ollama at the same time: neither server knows about the other's memory.
; ctx-size is shared by all `parallel` slots of a model (kv-unified); the app reads it
; as the model's num_ctx. Admin Panel -> Models changes ctx-size and parallel here
; (the file before is kept as models.ini.bak) and restarts the container.

[*]
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
kv-unified = true

[llama3.1:8b]
model = /models/sha256-667b0c1932bc6ffc593ed1d03f895bf2dc8dc6df21db3042284a6f4416b06a29
ctx-size = 24576
parallel = 8

[gemma4:12b]
model = /models/sha256-bb722270d54346adc198f213851dbe0207e87c3ecf2a0aff4d92262726215391
mmproj = /models/sha256-0cb0cd0a5c499d92942caa22fe5abb98f6e8874868d590e2b094ece4ac8e6d28
ctx-size = 16384
parallel = 4
